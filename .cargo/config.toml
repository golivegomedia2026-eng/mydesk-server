# 上游 sqlx::query! 编译期需读取示例库。上游 .env 的 ./db_v2.sqlite3 相对于 rustc 工作目录，
# 而本地路径依赖的 rustc 工作目录是本工作区根目录，所以从这里给出相对根目录的路径。
# 必须带 sqlite:// 前缀：sqlx 宏先按 URL 解析以确定驱动。
[env]
DATABASE_URL = "sqlite://third_party/rustdesk-server/db_v2.sqlite3"

# 与上游一致：Windows 静态链接 CRT，单个 exe 无需 VC 运行库
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
