[package]
name = "mydesk-server"
version = "0.1.0"
edition = "2021"
description = "MyDesk 单文件服务端：内含 ID/信令（hbbs）、中继（hbbr），后续加入账号 API 与 Web 后台"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "mydesk-server"
path = "src/main.rs"

[dependencies]
# 官方服务端（以 git submodule 固定版本），直接复用其信令服务与公共模块
hbbs = { path = "third_party/rustdesk-server" }
hbb_common = { path = "third_party/rustdesk-server/libs/hbb_common" }

# relay_server.rs 通过 #[path] 编入本 crate，下列依赖与上游版本保持一致
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
async-trait = "0.1"
base64 = "0.13"
lazy_static = "1.4"
sodiumoxide = "0.2"
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29" }
tungstenite = "0.29"
flexi_logger = { version = "0.22", features = ["async", "use_chrono_for_offset", "dont_minimize_extra_stacks"] }

[workspace]
exclude = ["third_party"]

# 与上游保持一致，否则 tungstenite 版本会分叉
[patch.crates-io]
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
